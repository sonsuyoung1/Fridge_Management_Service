<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org" lang="ko"><head><meta charset="UTF-8"><title>계정 설정</title><link rel="stylesheet" href="/common.css"></head><body><div class="container" style="max-width:560px"><div class="card"><a href="/refrigerator">← 냉장고 목록</a><h2>계정 설정</h2><form action="/user/email-notify" method="post" style="display:flex;justify-content:space-between;align-items:center;gap:12px"><label><input style="width:auto" type="checkbox" name="emailNotify" value="true" th:checked="${user.emailNotify}"> 이메일 알림 받기</label><button type="submit">저장</button></form><div style="display:grid;gap:10px;margin-top:20px"><a href="/user/my-info" class="button">내 정보</a><a href="/user/change-email" class="button">이메일 변경</a><a href="/user/change-password" class="button">비밀번호 변경</a></div></div></div><script>const p=new URLSearchParams(location.search);if(p.get('pw_success')==='true')alert('비밀번호가 변경되었습니다.');if(p.get('email_success')==='true')alert('이메일이 변경되었습니다.');if(p.get('notify_saved')==='true')alert('알림 설정이 저장되었습니다.');</script></body></html>
