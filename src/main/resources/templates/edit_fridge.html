<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org" lang="ko"><head><meta charset="UTF-8"><title>냉장고 수정</title><link rel="stylesheet" href="/common.css"><link rel="stylesheet" href="/edit_fridge.css"></head><body><div class="container fridge-form-wrap"><div class="card"><a href="/refrigerator">← 냉장고 목록</a><h2>냉장고 수정</h2><form th:action="@{'/fridge/edit/' + ${fridge.fridgeId}}" method="post" class="form-grid"><input type="text" name="fridgeName" th:value="${fridge.fridgeName}" required><select name="fridgeType" required><option value="일반 냉장고" th:selected="${fridge.fridgeType == '일반 냉장고'}">일반 냉장고</option><option value="김치 냉장고" th:selected="${fridge.fridgeType == '김치 냉장고'}">김치 냉장고</option><option value="미니 냉장고" th:selected="${fridge.fridgeType == '미니 냉장고'}">미니 냉장고</option></select><button type="submit">저장</button></form></div></div></body></html>
