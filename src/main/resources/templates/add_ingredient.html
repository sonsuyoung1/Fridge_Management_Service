<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org" lang="ko"><head><meta charset="UTF-8"><title>재료 추가</title><link rel="stylesheet" href="/common.css"><link rel="stylesheet" href="/add_edit_ingredient.css"></head><body><div class="container ingredient-form-wrap"><div class="card"><a th:href="@{/MainPage(fridgeId=${fridge.fridgeId})}">← 재료 목록</a><h2>재료 추가</h2><form action="/ingredient/add" method="post" class="ingredient-form"><input type="hidden" name="fridgeId" th:value="${fridge.fridgeId}"><input class="full" type="text" name="name" placeholder="재료명" required><select name="storageType"><option value="상온">상온</option><option value="냉장">냉장</option><option value="냉동">냉동</option></select><input type="number" name="quantity" min="0" value="1" required><select name="category"><option value="채소">채소</option><option value="과일">과일</option><option value="육류">육류</option><option value="유제품">유제품</option><option value="기타">기타</option></select><input type="date" name="expirationDate" required><button type="submit">저장</button></form></div></div></body></html>
