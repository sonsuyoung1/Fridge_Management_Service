<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org" lang="ko"><head><meta charset="UTF-8"><title>재료 수정</title><link rel="stylesheet" href="/common.css"><link rel="stylesheet" href="/add_edit_ingredient.css"></head><body><div class="container ingredient-form-wrap"><div class="card"><a th:href="@{/MainPage(fridgeId=${ingredient.fridge.fridgeId})}">← 재료 목록</a><h2>재료 수정</h2><form th:action="@{'/ingredient/edit/' + ${ingredient.id}}" method="post" class="ingredient-form"><input class="full" type="text" name="name" th:value="${ingredient.name}" required><select name="storageType"><option value="상온" th:selected="${ingredient.storageType == '상온'}">상온</option><option value="냉장" th:selected="${ingredient.storageType == '냉장'}">냉장</option><option value="냉동" th:selected="${ingredient.storageType == '냉동'}">냉동</option></select><input type="number" name="quantity" min="0" th:value="${ingredient.quantity}" required><select name="category"><option value="채소" th:selected="${ingredient.category == '채소'}">채소</option><option value="과일" th:selected="${ingredient.category == '과일'}">과일</option><option value="육류" th:selected="${ingredient.category == '육류'}">육류</option><option value="유제품" th:selected="${ingredient.category == '유제품'}">유제품</option><option value="기타" th:selected="${ingredient.category == '기타'}">기타</option></select><input type="date" name="expirationDate" th:value="${ingredient.expirationDate}" required><button type="submit">저장</button></form></div></div></body></html>
